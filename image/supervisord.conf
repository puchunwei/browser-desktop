[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:session]
# Keeps one xrdp session alive without any viewer, so CDP works before the first RDP login.
command=/entrypoint.sh session
priority=20
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:display-scale]
command=/entrypoint.sh wait-display /entrypoint.sh display-scale
priority=25
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser]
# Compose WASM needs a WebGL context. SwiftShader keeps it available without a physical GPU.
command=/entrypoint.sh wait-display /entrypoint.sh browser --window-position=0,0 --no-first-run --no-default-browser-check --use-angle=swiftshader --enable-unsafe-swiftshader %(ENV_BROWSER_SANDBOX_FLAGS)s --password-store=basic --remote-debugging-port=9223 --user-data-dir=%(ENV_BROWSER_PROFILE_DIR)s --start-maximized --restore-last-session
priority=30
autorestart=true
startretries=10
stopasgroup=false
stopwaitsecs=20
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cdp]
command=/usr/bin/socat TCP-LISTEN:%(ENV_CDP_PORT)s,bind=%(ENV_CDP_BIND_ADDRESS)s,fork,reuseaddr TCP:127.0.0.1:9223
priority=40
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

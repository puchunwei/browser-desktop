name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests
        run: |
          python3 -I tests/test-reconnects.py
          bash tests/privacy-scan.test.sh
      - name: install.sh
        run: bash tests/install-sh.test.sh
      - name: Repository privacy scan
        run: bash tests/privacy-scan.sh tree .
      - name: Pull the pinned base image
        # GitHub runners fail to pull from public.ecr.aws; Docker Hub serves the same
        # official image under the same digest, so the bytes stay identical.
        run: |
          base="$(sed -n 's/^ARG DEBIAN_IMAGE=//p' image/Dockerfile)"
          hub="docker.io/library/${base#public.ecr.aws/docker/library/}"
          [[ "$hub" == docker.io/library/debian:*@sha256:* ]] || { echo "unexpected base $base" >&2; exit 1; }
          echo "DEBIAN_IMAGE=$hub" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            docker pull "$hub" && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build
        run: docker build -f image/Dockerfile --build-arg DEBIAN_IMAGE="$DEBIAN_IMAGE" --build-arg IMAGE_REVISION="$GITHUB_SHA" -t browser-desktop:ci .
      - name: Image privacy scan
        run: bash tests/privacy-scan.sh image browser-desktop:ci
      - name: Startup checks
        run: REQUIRE_SANDBOX=0 bash tests/startup-checks.sh browser-desktop:ci

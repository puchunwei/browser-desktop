name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag against the pinned Chrome version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          chrome="$(sed -n 's/^ARG CHROME_VERSION=\(.*\)-1$/\1/p' image/Dockerfile)"
          [[ -n "$chrome" && "$version" =~ ^${chrome//./\\.}-[0-9]{8}$ ]] \
            || { echo "tag $GITHUB_REF_NAME must be v$chrome-YYYYMMDD" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Unit tests and repository privacy scan
        run: |
          python3 -I tests/test-reconnects.py
          bash tests/privacy-scan.test.sh
          bash tests/privacy-scan.sh tree .
      - name: Build
        run: |
          docker build -f image/Dockerfile \
            --build-arg IMAGE_VERSION="${{ steps.version.outputs.version }}" \
            --build-arg IMAGE_REVISION="$GITHUB_SHA" \
            --build-arg IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t browser-desktop:release .
      - name: Image privacy scan
        run: bash tests/privacy-scan.sh image browser-desktop:release
      - name: Startup checks
        run: REQUIRE_SANDBOX=0 bash tests/startup-checks.sh browser-desktop:release
      - name: Push to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "$VERSION" latest; do
            docker tag browser-desktop:release "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "Published \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$digest"

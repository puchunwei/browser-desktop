name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag against the pinned Chrome version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          chrome="$(sed -n 's/^ARG CHROME_VERSION=\(.*\)-1$/\1/p' image/Dockerfile)"
          # A same-day fix takes a revision suffix; published tags are never overwritten.
          [[ -n "$chrome" && "$version" =~ ^${chrome//./\\.}-[0-9]{8}(\.[0-9]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME must be v$chrome-YYYYMMDD or v$chrome-YYYYMMDD.N" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Unit tests and repository privacy scan
        run: |
          python3 -I tests/test-reconnects.py
          bash tests/privacy-scan.test.sh
          bash tests/privacy-scan.sh tree .
      - name: Pull the pinned base image
        # GitHub runners fail to pull from public.ecr.aws; Docker Hub serves the same
        # official image under the same digest, so the bytes stay identical.
        run: |
          base="$(sed -n 's/^ARG DEBIAN_IMAGE=//p' image/Dockerfile)"
          hub="docker.io/library/${base#public.ecr.aws/docker/library/}"
          [[ "$hub" == docker.io/library/debian:*@sha256:* ]] || { echo "unexpected base $base" >&2; exit 1; }
          echo "DEBIAN_IMAGE=$hub" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            docker pull "$hub" && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build
        run: |
          set -o pipefail
          # Job logs need a GitHub login; failure annotations stay readable without one.
          docker build --progress plain -f image/Dockerfile \
            --build-arg DEBIAN_IMAGE="$DEBIAN_IMAGE" \
            --build-arg IMAGE_VERSION="${{ steps.version.outputs.version }}" \
            --build-arg IMAGE_REVISION="$GITHUB_SHA" \
            --build-arg IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t browser-desktop:release . 2>&1 | tee build.log || {
            tail -n 9 build.log | sed 's/%/%25/g; s/^/::error title=docker build::/'
            exit 1
          }
      - name: Image privacy scan
        run: bash tests/privacy-scan.sh image browser-desktop:release
      - name: Startup checks
        run: REQUIRE_SANDBOX=0 bash tests/startup-checks.sh browser-desktop:release
      - name: Push to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "$VERSION" latest; do
            docker tag browser-desktop:release "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "Published \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$digest"
